name: Daily AI Read

on:
  schedule:
    # 12:35 UTC = 8:35am EDT — GitHub's cron delay lands the email near 9:00am
    - cron: "35 12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commits topics-log.json + archive back to the repo

concurrency:
  group: daily-ai-read
  cancel-in-progress: false

jobs:
  send-read:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python-scripts/daily-ai-read/requirements.txt

      - name: Install dependencies
        run: pip install -r python-scripts/daily-ai-read/requirements.txt

      - name: Generate and send today's read
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_SEND_TOKEN_JSON: ${{ secrets.GMAIL_SEND_TOKEN_JSON }}
        run: cd python-scripts/daily-ai-read && python main.py

      - name: Commit topic log and archive
        run: |
          git config user.name "daily-ai-read-bot"
          git config user.email "actions@github.com"
          git add python-scripts/daily-ai-read/topics-log.json python-scripts/daily-ai-read/archive
          git diff --cached --quiet && exit 0
          git commit -m "Daily AI Read: log + archive"
          git pull --rebase -X theirs origin main
          git push
