<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grocery List</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#272c37;
    --text:#e8ebf0; --muted:#8b93a3; --accent:#34d399; --accent-2:#22c55e;
    --accent-soft:rgba(52,211,153,.12); --danger:#f2555a; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f7; --line:#e4e8ee;
    --text:#1c2230; --muted:#6b7280; --accent:#10b981; --accent-2:#059669;
    --accent-soft:rgba(16,185,129,.1); --danger:#e0454a; --shadow:0 8px 30px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:150px;
    transition:background .3s,color .3s;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  /* Header */
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:18px 0 12px; border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .theme-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:1.05rem;
    display:grid;place-items:center;transition:.2s
  }
  .theme-btn:hover{color:var(--text);border-color:var(--accent)}

  /* Progress */
  .progress-card{margin-top:14px}
  .progress-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:.85rem}
  .progress-meta .count{font-weight:600;color:var(--text)}
  .progress-meta .money{color:var(--muted)}
  .progress-meta .money b{color:var(--accent);font-weight:700}
  .bar{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .45s cubic-bezier(.4,0,.2,1)}

  /* Category */
  .cat{margin-top:22px}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 4px}
  .cat-head h2{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .cat-head .line{flex:1;height:1px;background:var(--line)}
  .cat-head .n{font-size:.72rem;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:99px}

  /* Item */
  .item{
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;
    box-shadow:var(--shadow);transition:.2s;position:relative;overflow:hidden
  }
  .item.done{opacity:.5}
  .check{
    flex-shrink:0;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);
    display:grid;place-items:center;transition:.2s;cursor:pointer
  }
  .item.done .check{background:var(--accent);border-color:var(--accent)}
  .check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.5;fill:none;
    stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s}
  .item.done .check svg{stroke-dashoffset:0}
  .body{flex:1;min-width:0;cursor:pointer}
  .name{font-weight:600;font-size:.96rem;transition:.2s}
  .item.done .name{text-decoration:line-through;color:var(--muted)}
  .sub{font-size:.78rem;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}

  /* Quantity stepper */
  .qty{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);
    border-radius:9px;overflow:hidden;flex-shrink:0}
  .q-btn{width:26px;height:26px;border:none;background:transparent;color:var(--muted);
    font-size:1.05rem;cursor:pointer;display:grid;place-items:center;transition:.15s;line-height:1}
  .q-btn:hover{color:var(--accent);background:var(--accent-soft)}
  .q-n{min-width:26px;text-align:center;font-weight:700;font-size:.82rem;color:var(--text);font-variant-numeric:tabular-nums}

  .badge{background:var(--surface-2);padding:2px 9px;border-radius:7px;white-space:nowrap}
  .badge.deal{background:var(--accent-soft);color:var(--accent);font-weight:600}

  /* Price */
  .price{
    flex-shrink:0;font-weight:700;font-size:.95rem;color:var(--text);font-variant-numeric:tabular-nums;
    background:transparent;border:1px dashed transparent;border-radius:9px;padding:6px 9px;cursor:text;transition:.2s;
    font-family:inherit;min-width:52px;text-align:right
  }
  .price:hover{border-color:var(--line);background:var(--surface-2)}
  .price-edit{
    flex-shrink:0;width:78px;background:var(--surface-2);border:1px solid var(--accent);color:var(--text);
    border-radius:9px;padding:6px 9px;font-size:.95rem;font-weight:700;font-family:inherit;outline:none;text-align:right
  }
  .del{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;border:none;background:transparent;
    color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;opacity:.5
  }
  .del:hover{background:rgba(242,85,90,.12);color:var(--danger);opacity:1}
  .del svg{width:16px;height:16px}

  /* Footer / add bar */
  .footer{
    position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.25);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom))
  }
  .footer .wrap{padding:0}
  .add-row{display:flex;gap:8px}
  .add-row input,.add-row select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 13px;font-size:.92rem;font-family:inherit;outline:none;transition:.2s
  }
  .add-row input:focus,.add-row select:focus{border-color:var(--accent)}
  #newName{flex:1;min-width:0}
  #newCat{max-width:130px}
  .add-btn{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#04120c;
    font-weight:700;border-radius:11px;padding:0 16px;cursor:pointer;font-size:1.3rem;
    display:grid;place-items:center;transition:.2s;flex-shrink:0
  }
  .add-btn:hover{filter:brightness(1.08)}
  .add-extra{display:flex;gap:8px;margin-top:8px}

  /* Pretty price field */
  .price-field{
    display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:0 12px;transition:.2s;width:120px;flex-shrink:0
  }
  .price-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .price-field .dollar{color:var(--accent);font-weight:700;font-size:1rem;margin-right:3px}
  .price-field input{
    border:none;background:transparent;color:var(--text);padding:11px 0;font-size:.92rem;
    font-family:inherit;font-weight:600;outline:none;width:100%;font-variant-numeric:tabular-nums
  }
  .qty-field{
    display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:0 12px;width:78px;flex-shrink:0;transition:.2s
  }
  .qty-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .qty-field .x{color:var(--muted);font-weight:700;margin-right:4px}
  .qty-field input{border:none;background:transparent;color:var(--text);padding:11px 0;font-size:.92rem;
    font-family:inherit;font-weight:600;outline:none;width:100%}
  #newDeal{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 13px;font-size:.92rem;font-family:inherit;outline:none;transition:.2s}
  #newDeal:focus{border-color:var(--accent)}

  .actions{display:flex;gap:8px;margin-top:9px}
  .ghost-btn{
    flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--text)}
  .ghost-btn.warn:hover{border-color:var(--danger);color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.9rem}
  .done-banner{text-align:center;padding:16px;margin-top:18px;border-radius:14px;
    background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.95rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top-row">
      <h1><span class="dot"></span> Grocery List</h1>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">◐</button>
    </div>
    <div class="progress-card">
      <div class="progress-meta">
        <span class="count" id="countTxt">0 of 0 in cart</span>
        <span class="money">spent <b id="spentTxt">$0</b> / <span id="totalTxt">$0</span></span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>
</header>

<main class="wrap" id="list"></main>

<div class="footer">
  <div class="wrap">
    <div class="add-row">
      <input id="newName" placeholder="Add an item…" autocomplete="off">
      <select id="newCat"></select>
      <button class="add-btn" id="addBtn">+</button>
    </div>
    <div class="add-extra">
      <div class="price-field"><span class="dollar">$</span><input id="newPrice" placeholder="0.00" inputmode="decimal"></div>
      <div class="qty-field"><span class="x">×</span><input id="newQty" value="1" inputmode="numeric"></div>
      <input id="newDeal" placeholder="Best option / store (optional)">
    </div>
    <div class="actions">
      <button class="ghost-btn" id="resetBtn">↺ Uncheck all (new trip)</button>
      <button class="ghost-btn warn" id="restoreBtn">Restore default list</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'gray-grocery-v2';
const CATS = ['Meat & Seafood','Dairy & Eggs','Frozen','Pantry & Grains','Produce','Snacks & Treats','Buy Online / Elsewhere'];

// name, cat, unit price, qty, best-option note
const DEFAULTS = [
  ['Chicken (air-chilled breast is best)','Meat & Seafood',16,1,"TJ's air-chilled = less water weight"],
  ['Ground Beef 85/15, 2 lb','Meat & Seafood',11,1,"Best deal: Costco bulk"],
  ['Albacore Tuna, cans','Meat & Seafood',1.5,4,"Wild Planet if splurging"],
  ['Sardines in Olive Oil, cans','Meat & Seafood',1.75,4,"In olive oil, not soybean"],

  ['Cage-Free Eggs, dozen','Dairy & Eggs',3.5,3,"Best deal: Costco bulk"],
  ['Plain Greek Yogurt, tub','Dairy & Eggs',5,2,"Plain = no added sugar"],
  ['Cottage Cheese, tub','Dairy & Eggs',4,2,"Good Culture = cleanest"],
  ['Block Cheese','Dairy & Eggs',4,1,"Block over pre-shredded"],

  ['Fire-Roasted Peppers & Onions','Frozen',3,1,"Trader Joe's"],
  ['Organic Brown Rice (3-pack)','Frozen',3.5,1,"Frozen = 3-min cook"],
  ['Frozen Mixed Berries, bag','Frozen',4,2,"Best deal: Costco big bag"],

  ['Black Beans, cans','Pantry & Grains',1,3,"BPA-free can"],
  ['Corn Tortillas','Pantry & Grains',1.5,1,"Corn = gluten-free"],
  ['GF Rolled Oats','Pantry & Grains',4,1,"Best deal: Costco bulk"],
  ['Extra Virgin Olive Oil','Pantry & Grains',8,1,"Best value: Kirkland (real EVOO)"],
  ['Peanut Butter (peanuts + salt only)','Pantry & Grains',4,1,"1-ingredient, not sweetened"],
  ['Ground Cinnamon','Pantry & Grains',2,1,"Ceylon if available"],
  ['Raw Cashews','Pantry & Grains',6,1,"Best deal: Costco bulk"],
  ['Unsweetened Shredded Coconut','Pantry & Grains',3,1,"Unsweetened only"],
  ['Raw Honey (use sparingly — sugar)','Pantry & Grains',6,1,"Raw/unfiltered"],
  ['Sea Salt','Pantry & Grains',3,1,"TJ's fine; Redmond = premium"],
  ['Reduced-Sugar Craisins / fresh cranberries','Pantry & Grains',3,1,"Fresh/frozen unsweetened = best"],

  ['Sweet Potatoes','Produce',0.6,5,"Loose, by weight"],
  ['Bananas','Produce',0.25,7,"Cheapest carb there is"],

  ['Turkey Jerky','Snacks & Treats',6,1,"Check for low added sugar"],
  ['Roasted Seaweed Snacks','Snacks & Treats',1,2,"Iodine for thyroid"],
  ['85% Dark Chocolate, bar','Snacks & Treats',2,2,"85%+ = low sugar"],

  ['Whey Protein, 5 lb','Buy Online / Elsewhere',45,1,"Best value: Nutricost/NOW on Amazon"],
  ['Monk Fruit / Stevia','Buy Online / Elsewhere',10,1,"NOW Better Stevia (pure, no fillers)"],
  ['Parchment Paper','Buy Online / Elsewhere',4,1,"Any brand"],
];

let items = load();

function load(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if(Array.isArray(saved) && saved.length) return saved.map(x=>({qty:1,...x}));
  }catch(e){}
  return seed();
}
function seed(){
  return DEFAULTS.map((d,i)=>({id:'i'+i+'_'+Date.now(),name:d[0],cat:d[1],price:d[2],qty:d[3]||1,deal:d[4],done:false}));
}
function save(){localStorage.setItem(STORE_KEY, JSON.stringify(items));}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');}

function render(){
  const list = document.getElementById('list');
  list.innerHTML='';
  const total = items.reduce((s,x)=>s+(+x.price||0)*(x.qty||1),0);
  const spent = items.filter(x=>x.done).reduce((s,x)=>s+(+x.price||0)*(x.qty||1),0);
  const done = items.filter(x=>x.done).length;

  document.getElementById('countTxt').textContent = `${done} of ${items.length} in cart`;
  document.getElementById('spentTxt').textContent = money(spent);
  document.getElementById('totalTxt').textContent = money(total);
  document.getElementById('barFill').style.width = items.length? (done/items.length*100)+'%':'0%';

  if(!items.length){list.innerHTML='<div class="empty">List is empty. Add items below or restore the default list.</div>';return;}

  CATS.forEach(cat=>{
    const group = items.filter(x=>x.cat===cat);
    if(!group.length) return;
    const boughtN = group.filter(x=>x.done).length;
    const sec = document.createElement('section');
    sec.className='cat';
    sec.innerHTML = `<div class="cat-head"><h2>${cat}</h2><div class="line"></div><span class="n">${boughtN}/${group.length}</span></div>`;
    group.forEach(it=>sec.appendChild(itemEl(it)));
    list.appendChild(sec);
  });

  if(done===items.length && items.length){
    const b=document.createElement('div');b.className='done-banner';b.textContent='✓ All done — cart complete';
    list.appendChild(b);
  }
}

function itemEl(it){
  const el=document.createElement('div');
  el.className='item'+(it.done?' done':'');
  const line=(+it.price||0)*(it.qty||1);
  const deal = it.deal? `<span class="badge deal">${escapeHtml(it.deal)}</span>`:'';
  el.innerHTML=`
    <div class="check" data-role="toggle"><svg viewBox="0 0 20 20"><polyline points="4,11 8,15 16,5"/></svg></div>
    <div class="body" data-role="toggle">
      <div class="name">${escapeHtml(it.name)}</div>
      <div class="sub">
        <span class="qty">
          <button class="q-btn q-minus" aria-label="less">−</button>
          <span class="q-n">${it.qty||1}</span>
          <button class="q-btn q-plus" aria-label="more">+</button>
        </span>
        ${deal}
      </div>
    </div>
    <button class="price" title="Tap to edit price">${money(line)}</button>
    <button class="del" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>`;

  el.querySelectorAll('[data-role="toggle"]').forEach(node=>{
    node.addEventListener('click',()=>{it.done=!it.done;save();render();});
  });
  el.querySelector('.q-minus').addEventListener('click',e=>{e.stopPropagation();it.qty=Math.max(1,(it.qty||1)-1);save();render();});
  el.querySelector('.q-plus').addEventListener('click',e=>{e.stopPropagation();it.qty=(it.qty||1)+1;save();render();});
  el.querySelector('.del').addEventListener('click',e=>{e.stopPropagation();del(it.id);});

  const priceBtn=el.querySelector('.price');
  priceBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const inp=document.createElement('input');
    inp.className='price-edit';inp.type='text';inp.inputMode='decimal';
    inp.value=(+it.price)? (+it.price) : '';inp.placeholder='0.00';
    priceBtn.replaceWith(inp);inp.focus();inp.select();
    const commit=()=>{it.price=parseFloat(inp.value.replace(/[^0-9.]/g,''))||0;save();render();};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();});
  });
  return el;
}

function del(id){items=items.filter(x=>x.id!==id);save();render();}

function add(){
  const name=document.getElementById('newName').value.trim();
  if(!name) return;
  const cat=document.getElementById('newCat').value;
  const price=parseFloat(document.getElementById('newPrice').value.replace(/[^0-9.]/g,''))||0;
  const qty=Math.max(1,parseInt(document.getElementById('newQty').value)||1);
  const deal=document.getElementById('newDeal').value.trim();
  items.push({id:'i_'+Date.now(),name,cat,price,qty,deal,done:false});
  save();render();
  document.getElementById('newName').value='';
  document.getElementById('newPrice').value='';
  document.getElementById('newQty').value='1';
  document.getElementById('newDeal').value='';
  document.getElementById('newName').focus();
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function initTheme(){const t=localStorage.getItem('gray-grocery-theme');if(t)document.documentElement.setAttribute('data-theme',t);}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='light'?'':'light';
  if(cur)document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('gray-grocery-theme',cur);
});

const catSel=document.getElementById('newCat');
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
document.getElementById('addBtn').addEventListener('click',add);
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')add();});
document.getElementById('newDeal').addEventListener('keydown',e=>{if(e.key==='Enter')add();});
document.getElementById('resetBtn').addEventListener('click',()=>{items.forEach(x=>x.done=false);save();render();});
document.getElementById('restoreBtn').addEventListener('click',()=>{
  if(confirm('Restore the default grocery list? This replaces your current list.')){items=seed();save();render();}
});

initTheme();
render();
</script>
</body>
</html>
