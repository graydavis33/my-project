<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grocery List</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#272c37;
    --text:#e8ebf0; --muted:#8b93a3; --accent:#34d399; --accent-2:#22c55e;
    --accent-soft:rgba(52,211,153,.12); --danger:#f2555a; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f7; --line:#e4e8ee;
    --text:#1c2230; --muted:#6b7280; --accent:#10b981; --accent-2:#059669;
    --accent-soft:rgba(16,185,129,.1); --danger:#e0454a; --shadow:0 8px 30px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:120px;
    transition:background .3s,color .3s;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  /* Header */
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:18px 0 12px; border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .theme-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:1.05rem;
    display:grid;place-items:center;transition:.2s
  }
  .theme-btn:hover{color:var(--text);border-color:var(--accent)}

  /* Progress */
  .progress-card{margin-top:14px}
  .progress-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:.85rem}
  .progress-meta .count{font-weight:600;color:var(--text)}
  .progress-meta .money{color:var(--muted)}
  .progress-meta .money b{color:var(--accent);font-weight:700}
  .bar{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .45s cubic-bezier(.4,0,.2,1)}

  /* Category */
  .cat{margin-top:22px}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 4px}
  .cat-head h2{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .cat-head .line{flex:1;height:1px;background:var(--line)}
  .cat-head .n{font-size:.72rem;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:99px}

  /* Item */
  .item{
    display:flex;align-items:center;gap:13px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;
    box-shadow:var(--shadow);transition:.2s;cursor:pointer;position:relative;overflow:hidden
  }
  .item:active{transform:scale(.992)}
  .item.done{opacity:.55}
  .check{
    flex-shrink:0;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);
    display:grid;place-items:center;transition:.2s
  }
  .item.done .check{background:var(--accent);border-color:var(--accent)}
  .check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.5;fill:none;
    stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s}
  .item.done .check svg{stroke-dashoffset:0}
  .body{flex:1;min-width:0}
  .name{font-weight:600;font-size:.97rem;transition:.2s}
  .item.done .name{text-decoration:line-through;color:var(--muted)}
  .sub{font-size:.78rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .badge{background:var(--surface-2);padding:1px 8px;border-radius:6px;white-space:nowrap}
  .badge.deal{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .price{font-weight:700;font-size:.9rem;color:var(--text);flex-shrink:0;font-variant-numeric:tabular-nums}
  .del{
    flex-shrink:0;width:32px;height:32px;border-radius:9px;border:none;background:transparent;
    color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;opacity:.5
  }
  .del:hover{background:rgba(242,85,90,.12);color:var(--danger);opacity:1}
  .del svg{width:16px;height:16px}

  /* Add bar (fixed bottom) */
  .footer{
    position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
    border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.25);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom))
  }
  .footer .wrap{padding:0}
  .add-row{display:flex;gap:8px}
  .add-row input,.add-row select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:11px 13px;font-size:.92rem;font-family:inherit;outline:none;transition:.2s
  }
  .add-row input:focus,.add-row select:focus{border-color:var(--accent)}
  #newName{flex:1;min-width:0}
  #newCat{max-width:135px}
  .add-btn{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#04120c;
    font-weight:700;border-radius:11px;padding:0 16px;cursor:pointer;font-size:1.3rem;
    display:grid;place-items:center;transition:.2s
  }
  .add-btn:hover{filter:brightness(1.08)}
  .add-extra{display:flex;gap:8px;margin-top:8px}
  .add-extra input{flex:1}
  .actions{display:flex;gap:8px;margin-top:9px}
  .ghost-btn{
    flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--text)}
  .ghost-btn.warn:hover{border-color:var(--danger);color:var(--danger)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.9rem}
  .done-banner{
    text-align:center;padding:16px;margin-top:18px;border-radius:14px;
    background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.95rem
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top-row">
      <h1><span class="dot"></span> Grocery List</h1>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">◐</button>
    </div>
    <div class="progress-card">
      <div class="progress-meta">
        <span class="count" id="countTxt">0 of 0 in cart</span>
        <span class="money">spent <b id="spentTxt">$0</b> / <span id="totalTxt">$0</span></span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>
</header>

<main class="wrap" id="list"></main>

<div class="footer">
  <div class="wrap">
    <div class="add-row">
      <input id="newName" placeholder="Add an item…" autocomplete="off">
      <select id="newCat"></select>
      <button class="add-btn" id="addBtn">+</button>
    </div>
    <div class="add-extra">
      <input id="newPrice" placeholder="Price (optional)  e.g. 4.99" inputmode="decimal">
      <input id="newDeal" placeholder="Store / best deal (optional)">
    </div>
    <div class="actions">
      <button class="ghost-btn" id="resetBtn">↺ Uncheck all (new trip)</button>
      <button class="ghost-btn warn" id="restoreBtn">Restore default list</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'gray-grocery-v1';
const CATS = ['Meat & Seafood','Dairy & Eggs','Frozen','Pantry & Grains','Produce','Snacks & Treats','Buy Online / Elsewhere'];

// name, cat, price, deal (store / best-deal note)
const DEFAULTS = [
  ['Chicken (air-chilled breast or thighs), ~3.5 lb','Meat & Seafood',16,"Trader Joe's"],
  ['Ground Beef 85/15, 2 lb','Meat & Seafood',11,"TJ's · Costco cheaper in bulk"],
  ['Albacore Tuna, 4 cans','Meat & Seafood',6,"Trader Joe's"],
  ['Sardines in Olive Oil, 4 cans','Meat & Seafood',7,"Trader Joe's"],

  ['Cage-Free Eggs, 3 dozen','Dairy & Eggs',10,"TJ's · Costco cheaper in bulk"],
  ['Plain Greek Yogurt, 2 tubs','Dairy & Eggs',10,"Trader Joe's"],
  ['Cottage Cheese, 2 tubs','Dairy & Eggs',8,"Trader Joe's"],
  ['Block Cheese','Dairy & Eggs',4,"Trader Joe's"],

  ['Fire-Roasted Peppers & Onions','Frozen',3,"Trader Joe's"],
  ['Organic Brown Rice (3-pack)','Frozen',3.5,"Trader Joe's"],
  ['Frozen Mixed Berries, 2 bags','Frozen',8,"TJ's · Costco big bag = best deal"],

  ['Black Beans, 3 cans','Pantry & Grains',3,"Trader Joe's"],
  ['Corn Tortillas','Pantry & Grains',1.5,"Trader Joe's"],
  ['GF Rolled Oats','Pantry & Grains',4,"TJ's · Costco cheaper bulk"],
  ['Extra Virgin Olive Oil','Pantry & Grains',8,"TJ's · Costco Kirkland = best value"],
  ['Peanut Butter (peanuts + salt only)','Pantry & Grains',4,"Trader Joe's"],
  ['Ground Cinnamon','Pantry & Grains',2,"Trader Joe's"],
  ['Raw Cashews','Pantry & Grains',6,"TJ's · Costco cheaper bulk"],
  ['Unsweetened Shredded Coconut','Pantry & Grains',3,"Trader Joe's"],
  ['Raw Honey (use sparingly — sugar)','Pantry & Grains',6,"Trader Joe's"],
  ['Sea Salt','Pantry & Grains',3,"Trader Joe's"],
  ['Reduced-Sugar Craisins / fresh cranberries','Pantry & Grains',3,"Trader Joe's"],

  ['Sweet Potatoes, 5','Produce',3,"Trader Joe's"],
  ['Bananas, 7','Produce',1.5,"Trader Joe's"],

  ['Turkey Jerky (check sugar)','Snacks & Treats',6,"Trader Joe's"],
  ['Roasted Seaweed Snacks, 2','Snacks & Treats',2,"Trader Joe's"],
  ['85% Dark Chocolate, 2 bars','Snacks & Treats',4,"Trader Joe's"],

  ['Whey Protein, 5 lb','Buy Online / Elsewhere',45,"Nutricost/NOW · Amazon (best value bulk)"],
  ['Monk Fruit / Stevia','Buy Online / Elsewhere',10,"NOW Better Stevia · Whole Foods/Amazon"],
  ['Parchment Paper','Buy Online / Elsewhere',4,"Any grocery"],
];

let items = load();

function load(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if(Array.isArray(saved) && saved.length) return saved;
  }catch(e){}
  return seed();
}
function seed(){
  return DEFAULTS.map((d,i)=>({id:'i'+i+'_'+Date.now(),name:d[0],cat:d[1],price:d[2],deal:d[3],done:false}));
}
function save(){localStorage.setItem(STORE_KEY, JSON.stringify(items));}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');}

function render(){
  const list = document.getElementById('list');
  list.innerHTML='';
  const total = items.reduce((s,x)=>s+(+x.price||0),0);
  const spent = items.filter(x=>x.done).reduce((s,x)=>s+(+x.price||0),0);
  const done = items.filter(x=>x.done).length;

  document.getElementById('countTxt').textContent = `${done} of ${items.length} in cart`;
  document.getElementById('spentTxt').textContent = money(spent);
  document.getElementById('totalTxt').textContent = money(total);
  document.getElementById('barFill').style.width = items.length? (done/items.length*100)+'%':'0%';

  if(!items.length){list.innerHTML='<div class="empty">List is empty. Add items below or restore the default list.</div>';return;}

  CATS.forEach(cat=>{
    const group = items.filter(x=>x.cat===cat);
    if(!group.length) return;
    const boughtN = group.filter(x=>x.done).length;
    const sec = document.createElement('section');
    sec.className='cat';
    sec.innerHTML = `<div class="cat-head"><h2>${cat}</h2><div class="line"></div><span class="n">${boughtN}/${group.length}</span></div>`;
    group.forEach(it=>sec.appendChild(itemEl(it)));
    list.appendChild(sec);
  });

  if(done===items.length && items.length){
    const b=document.createElement('div');b.className='done-banner';b.textContent='✓ All done — cart complete';
    list.appendChild(b);
  }
}

function itemEl(it){
  const el=document.createElement('div');
  el.className='item'+(it.done?' done':'');
  const deal = it.deal? `<span class="badge deal">${it.deal}</span>`:'';
  const price = it.price? `<span class="price">${money(+it.price)}</span>`:'';
  el.innerHTML=`
    <div class="check"><svg viewBox="0 0 20 20"><polyline points="4,11 8,15 16,5"/></svg></div>
    <div class="body">
      <div class="name">${escapeHtml(it.name)}</div>
      <div class="sub">${deal}</div>
    </div>
    ${price}
    <button class="del" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>`;
  el.addEventListener('click',e=>{
    if(e.target.closest('.del')){del(it.id);return;}
    it.done=!it.done; save(); render();
  });
  return el;
}

function del(id){items=items.filter(x=>x.id!==id);save();render();}

function add(){
  const name=document.getElementById('newName').value.trim();
  if(!name) return;
  const cat=document.getElementById('newCat').value;
  const priceRaw=document.getElementById('newPrice').value.trim();
  const price=priceRaw?parseFloat(priceRaw.replace(/[^0-9.]/g,'')):0;
  const deal=document.getElementById('newDeal').value.trim();
  items.push({id:'i_'+Date.now(),name,cat,price:price||0,deal,done:false});
  save();render();
  document.getElementById('newName').value='';
  document.getElementById('newPrice').value='';
  document.getElementById('newDeal').value='';
  document.getElementById('newName').focus();
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// theme
function initTheme(){
  const t=localStorage.getItem('gray-grocery-theme');
  if(t) document.documentElement.setAttribute('data-theme',t);
}
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='light'?'':'light';
  if(cur) document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('gray-grocery-theme',cur);
});

// wire up
const catSel=document.getElementById('newCat');
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
document.getElementById('addBtn').addEventListener('click',add);
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')add();});
document.getElementById('resetBtn').addEventListener('click',()=>{
  items.forEach(x=>x.done=false);save();render();
});
document.getElementById('restoreBtn').addEventListener('click',()=>{
  if(confirm('Restore the default grocery list? This replaces your current list.')){
    items=seed();save();render();
  }
});

initTheme();
render();
</script>
</body>
</html>
